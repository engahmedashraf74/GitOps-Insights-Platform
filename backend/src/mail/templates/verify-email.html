<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;color:#0f172a;font-family:Inter,Segoe UI,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid rgba(15,23,42,0.1);border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#0f766e;">GitOps Insights · Public Beta</p>
                <h1 style="margin:0 0 16px;font-size:24px;color:#0f172a;">Verify your email</h1>
                <p style="margin:0 0 16px;line-height:1.6;color:#334155;">
                  Hi {{email}}, confirm this address to activate your workspace. Until you verify, sign-in is blocked.
                </p>
                <p style="margin:24px 0;">
                  <a href="{{verifyUrl}}" style="display:inline-block;background:#0f766e;color:#f8fafc;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:10px;">
                    Verify email
                  </a>
                </p>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
                  If the button does not work, paste this URL into your browser:<br />
                  {{verifyUrl}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
