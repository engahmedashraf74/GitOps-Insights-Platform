            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - |
          echo "DNS lookup for postgres:"
          getent hosts postgres || nslookup postgres || true
          i=0
          until pg_isready -h postgres -p 5432 -U "$PGUSER" -d "$PGDATABASE"; do
            i=$((i + 1))
            if [ "$i" -gt 30 ]; then
              echo "Postgres is not reachable at postgres:5432"
              getent hosts postgres || true
              exit 1
            fi
            echo "Waiting for Postgres ($i/30)..."
            sleep 2
          done
          echo "Postgres is accepting connections"
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: postgres-credentials
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: postgres-credentials
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: postgres-credentials
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-postgres
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
